name: Publish to Maven Central

# Started by hand on a tag (Actions, Publish to Maven Central, Run workflow, Use workflow from: Tags).
# Tests, then ONE signed bundle with ai.quranlab:tajweedformer and ai.quranlab:tajweedformer-compose, then the
# Central Portal upload. `publishing` decides what the Portal does with it:
#   USER_MANAGED (the default, SDK 4.0.0): the Portal validates the bundle and keeps it. The run waits until the
#     deployment is VALIDATED and stops there; nothing is on Maven Central until someone with the namespace presses
#     Publish on that deployment at https://central.sonatype.com/publishing/deployments (or Drop, to discard it).
#   AUTOMATIC: the Portal publishes it to Maven Central without a person once it validates; the run waits until
#     PUBLISHED.
# Either way the run fails, with the Portal's reasons, when validation fails or the state it waits for does not come
# within 30 minutes.
#
# One bundle, one deployment: the Compose artifact works only with the core of exactly the same version, so both
# artifacts of a version are published or neither is. The Portal validates a deployment as a whole.
#
# 3.x publishes AUTOMATIC since 2026-11-13, by Quran Lab's decision. SDK 4.0.0 is staged USER_MANAGED: Quran Lab
# presses Publish on the Portal. A version published to Maven Central can never be taken back or replaced, so
# nothing is tagged before CI on main is green and the release's final check passes, and this workflow runs only on
# a tag that equals tajweedformer.version, after the tests and the monitor check below. A two-artifact deployment
# left waiting is published on the Portal itself (the workflow "Publish one validated deployment" takes a deployment
# of the core alone).

on:
  workflow_dispatch:
    inputs:
      publishing:
        description: "USER_MANAGED: validate and wait for Publish on the Central Portal. AUTOMATIC: publish once valid"
        required: true
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED

permissions:
  contents: read

jobs:
  publish:
    name: Test, sign, upload to the Central Portal and wait until it is published
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: |
          v=$(sed -n 's/^tajweedformer.version=//p' gradle.properties)
          [ -n "$v" ] && [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME is not tajweedformer.version $v" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # From here to the end marker: the steps that the bundle dry run (bundle-dry-run.yml) runs too, the same text in
      # both files; scripts/check_bundle_steps.py fails CI when they differ. They read the version from VERSION.
      # bundle-steps:begin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # SDK 4.0: the AAR carries the Quran Lab Core, never built here: its Android binaries come from this release's
      # folder on cdn.quranlab.ai, checked against native/core/CORE_RELEASE (scripts/ci-core.sh)
      - name: The Quran Lab Core's Android binaries for this version, checked against native/core/CORE_RELEASE
        run: bash scripts/ci-core.sh "$VERSION" "$RUNNER_TEMP/qlcore"
      # the same tests as the CI workflow, in the same way
      - name: libopus for the sharing tests (built first, so no sharing test ever skips)
        run: echo "TAJWEEDFORMER_OPUS_LIBRARY=$(bash scripts/opus/build_opus_host.sh)" >> "$GITHUB_ENV"
      - name: JVM tests (libopus required; the tests that need the Core's test release skip)
        run: TJ_REQUIRE_OPUS=1 ./gradlew --no-daemon :tajweedformer-jvm:test -PnoNative
      - name: The Compose module's unit tests (the sharing sheet's layout and screenshot tests), before anything is signed or uploaded
        run: ./gradlew --no-daemon :tajweedformer-compose:testDebugUnitTest
      - name: Signed bundle of both artifacts (the core's AAR with the Quran Lab Core for arm64-v8a, armeabi-v7a and x86_64, the Compose module's AAR; each with sources, javadoc, POM, signatures, checksums)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "no SIGNING_KEY secret" >&2; exit 1; }
          # the core's task builds and zips both publications, and fails when a file of either is missing (the Core,
          # its bridge and the Opus encoder for every ABI among them)
          ./gradlew --no-daemon :tajweedformer:centralBundle
          unzip -l tajweedformer/build/distributions/central-bundle-*.zip
          for a in tajweedformer tajweedformer-compose; do
            unzip -l tajweedformer/build/distributions/central-bundle-*.zip | grep -q "ai/quranlab/$a/$VERSION/$a-$VERSION\.pom\$" \
              || { echo "the bundle has no $a of $VERSION" >&2; exit 1; }
          done
      - name: Android's verifier rule on monitors, on both AARs inside the bundle (nothing is uploaded when a class would be rejected on a phone)
        run: |
          python3 scripts/check_monitor_handlers.py --expect-rejected scripts/testdata/Telemetry-2.0.2.class
          rm -rf build/monitor-check && mkdir -p build/monitor-check
          unzip -o -q tajweedformer/build/distributions/central-bundle-*.zip '*.aar' -d build/monitor-check
          python3 scripts/check_monitor_handlers.py build/monitor-check
      # bundle-steps:end
      - name: Upload to the Central Portal (${{ inputs.publishing }}) and wait until the deployment is VALIDATED (USER_MANAGED) or PUBLISHED (AUTOMATIC)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISHING: ${{ inputs.publishing }}
        run: |
          [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_CENTRAL_PASSWORD" ] || { echo "no Central Portal secrets" >&2; exit 1; }
          case $PUBLISHING in USER_MANAGED|AUTOMATIC) ;; *) echo "publishing is USER_MANAGED or AUTOMATIC, not $PUBLISHING" >&2; exit 1 ;; esac
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          api=https://central.sonatype.com/api/v1/publisher
          bundle=$(ls tajweedformer/build/distributions/central-bundle-*.zip)
          echo "bundle $(basename "$bundle") sha256 $(sha256sum "$bundle" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          id=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle;type=application/octet-stream" \
            "$api/upload?publishingType=$PUBLISHING&name=ai.quranlab:tajweedformer:$GITHUB_REF_NAME")
          echo "deployment $id"
          echo "Deployment \`$id\` was uploaded ($PUBLISHING)." >> "$GITHUB_STEP_SUMMARY"
          # this run's own deployment, by its id, until the Portal says VALIDATED (USER_MANAGED) or PUBLISHED
          # (AUTOMATIC): 90 times 20 s is 30 minutes
          state=unknown
          for _ in $(seq 1 90); do
            sleep 20
            status=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" "$api/status?id=$id") || { echo "the status request failed, asking again"; continue; }
            state=$(printf '%s' "$status" | jq -r .deploymentState)
            echo "state $state"
            case $state in
              VALIDATED)
                [ "$PUBLISHING" = USER_MANAGED ] || continue
                printf '%s' "$status" | jq '{deploymentId, deploymentName, deploymentState, purls}'
                {
                  echo "Deployment \`$id\` (ai.quranlab:tajweedformer:$GITHUB_REF_NAME) is VALIDATED and waits on the Central Portal. Nothing is on Maven Central yet."
                  echo "To release it: https://central.sonatype.com/publishing/deployments, that deployment, Publish. To discard it: Drop."
                  echo "Components: $(printf '%s' "$status" | jq -r '.purls | join(", ")')"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              PUBLISHED)
                {
                  echo "Deployment \`$id\` is PUBLISHED: ai.quranlab:tajweedformer and ai.quranlab:tajweedformer-compose $GITHUB_REF_NAME are on their way to Maven Central."
                  echo "https://repo1.maven.org/maven2/ai/quranlab/tajweedformer/$GITHUB_REF_NAME/"
                  echo "https://repo1.maven.org/maven2/ai/quranlab/tajweedformer-compose/$GITHUB_REF_NAME/"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              FAILED)
                echo "::error::The Central Portal refused deployment $id: validation or publishing FAILED. Nothing of $GITHUB_REF_NAME is on Maven Central."
                printf '%s' "$status" | jq .errors
                echo "Deployment \`$id\` FAILED on the Central Portal; its reasons are in the run's log." >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
          done
          want=PUBLISHED; [ "$PUBLISHING" = USER_MANAGED ] && want=VALIDATED
          echo "::error::Deployment $id was not $want within 30 minutes (last state $state). Look at https://central.sonatype.com/publishing/deployments before anything is uploaded again."
          echo "Deployment \`$id\` was not $want within 30 minutes (last state $state)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
