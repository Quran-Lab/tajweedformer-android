name: Publish to Maven Central

# Started by hand on a tag (Actions, Publish to Maven Central, Run workflow, Use workflow from: Tags).
# Tests, then ONE signed bundle with ai.quranlab:tajweedformer and ai.quranlab:tajweedformer-compose, then the
# Central Portal upload as AUTOMATIC: the Portal validates the bundle and, when it passes, publishes it to Maven
# Central without a person. The run waits for its own deployment and fails, with the Portal's reasons, when
# validation fails or the deployment is not PUBLISHED within 30 minutes.
#
# One bundle, one deployment: the Compose artifact works only with the core of exactly the same version, so both
# artifacts of a version are published or neither is. The Portal validates a deployment as a whole.
#
# Automatic since 2026-11-13, by Quran Lab's decision: before, the upload waited on the Portal for someone to
# press Publish, and every release waited with it. A version published to Maven Central can never be taken back
# or replaced, so THE TAG IS THE LAST GATE: nothing is tagged before CI on main is green and the release's final
# check passes, and this workflow runs only on a tag that equals tajweedformer.version, after the tests and the
# monitor check below. A deployment that an earlier version of this workflow left waiting is published by the
# workflow "Publish one validated deployment", by its id.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Test, sign, upload to the Central Portal and wait until it is published
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: |
          v=$(sed -n 's/^tajweedformer.version=//p' gradle.properties)
          [ -n "$v" ] && [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME is not tajweedformer.version $v" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # From here to the end marker: the steps that the bundle dry run (bundle-dry-run.yml) runs too, the same text in
      # both files; scripts/check_bundle_steps.py fails CI when they differ. They read the version from VERSION.
      # bundle-steps:begin
      - name: Engine submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-engine.sh engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tools (ninja makes the host build faster, without it scripts/build_host.sh uses make)
        run: |
          command -v ninja || timeout 120 sudo apt-get install -y ninja-build || echo "ninja-build was not installed (the package mirror did not answer), the host build uses make"
      # the same tests as the CI workflow, in the same way (the 2.x list named test classes that 3.0 does not have)
      - name: libopus for the sharing tests (built first, so no sharing test ever skips)
        run: bash scripts/opus/build_opus_host.sh
      - name: JVM tests (no engine; libopus required)
        run: TJ_REQUIRE_OPUS=1 ./gradlew --no-daemon :tajweedformer-jvm:test -PnoNative
      - name: JVM tests with the engine (the host JNI library is built; the model-dependent ones skip without the model)
        run: |
          ./gradlew --no-daemon :tajweedformer-jvm:cleanTest :tajweedformer-jvm:test -Pnative \
            --tests 'ai.quranlab.tajweedformer.V4ConformanceTest' --tests 'ai.quranlab.tajweedformer.TajweedApiTest' \
            --tests 'ai.quranlab.tajweedformer.TajweedModelTest' --tests 'ai.quranlab.tajweedformer.ManifestTest' \
            --tests 'ai.quranlab.tajweedformer.LayersTest' --tests 'ai.quranlab.tajweedformer.TakeLimitsTest'
      - name: The Compose module's unit tests (the sharing sheet's layout and screenshot tests), before anything is signed or uploaded
        run: ./gradlew --no-daemon :tajweedformer-compose:testDebugUnitTest
      - name: Signed bundle of both artifacts (the core's AAR with arm64-v8a, armeabi-v7a and x86_64, the Compose module's AAR; each with sources, javadoc, POM, signatures, checksums)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "no SIGNING_KEY secret" >&2; exit 1; }
          # the core's task builds and zips both publications, and fails when a file of either is missing
          ./gradlew --no-daemon :tajweedformer:centralBundle
          unzip -l tajweedformer/build/distributions/central-bundle-*.zip
          for a in tajweedformer tajweedformer-compose; do
            unzip -l tajweedformer/build/distributions/central-bundle-*.zip | grep -q "ai/quranlab/$a/$VERSION/$a-$VERSION\.pom\$" \
              || { echo "the bundle has no $a of $VERSION" >&2; exit 1; }
          done
      - name: Android's verifier rule on monitors, on both AARs inside the bundle (nothing is uploaded when a class would be rejected on a phone)
        run: |
          python3 scripts/check_monitor_handlers.py --expect-rejected scripts/testdata/Telemetry-2.0.2.class
          rm -rf build/monitor-check && mkdir -p build/monitor-check
          unzip -o -q tajweedformer/build/distributions/central-bundle-*.zip '*.aar' -d build/monitor-check
          python3 scripts/check_monitor_handlers.py build/monitor-check
      # bundle-steps:end
      - name: Upload to the Central Portal (AUTOMATIC) and wait until the deployment is PUBLISHED
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_CENTRAL_PASSWORD" ] || { echo "no Central Portal secrets" >&2; exit 1; }
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          api=https://central.sonatype.com/api/v1/publisher
          bundle=$(ls tajweedformer/build/distributions/central-bundle-*.zip)
          id=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle;type=application/octet-stream" \
            "$api/upload?publishingType=AUTOMATIC&name=ai.quranlab:tajweedformer:$GITHUB_REF_NAME")
          echo "deployment $id"
          echo "Deployment \`$id\` was uploaded for automatic publishing." >> "$GITHUB_STEP_SUMMARY"
          # this run's own deployment, by its id, until the Portal says PUBLISHED: 90 times 20 s is 30 minutes
          state=unknown
          for _ in $(seq 1 90); do
            sleep 20
            status=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" "$api/status?id=$id") || { echo "the status request failed, asking again"; continue; }
            state=$(printf '%s' "$status" | jq -r .deploymentState)
            echo "state $state"
            case $state in
              PUBLISHED)
                {
                  echo "Deployment \`$id\` is PUBLISHED: ai.quranlab:tajweedformer and ai.quranlab:tajweedformer-compose $GITHUB_REF_NAME are on their way to Maven Central."
                  echo "https://repo1.maven.org/maven2/ai/quranlab/tajweedformer/$GITHUB_REF_NAME/"
                  echo "https://repo1.maven.org/maven2/ai/quranlab/tajweedformer-compose/$GITHUB_REF_NAME/"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              FAILED)
                echo "::error::The Central Portal refused deployment $id: validation or publishing FAILED. Nothing of $GITHUB_REF_NAME is on Maven Central."
                printf '%s' "$status" | jq .errors
                echo "Deployment \`$id\` FAILED on the Central Portal; its reasons are in the run's log." >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
          done
          echo "::error::Deployment $id was not PUBLISHED within 30 minutes (last state $state). It may still be published by the Portal: look at https://central.sonatype.com/publishing/deployments before anything is uploaded again."
          echo "Deployment \`$id\` was not PUBLISHED within 30 minutes (last state $state)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
