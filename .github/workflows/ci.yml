name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM tests (no engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: libopus for the sharing tests (built first, so no sharing test ever skips)
        run: bash scripts/opus/build_opus_host.sh
      - name: Test (libopus required)
        run: TJ_REQUIRE_OPUS=1 ./gradlew --no-daemon :tajweedformer-jvm:test -PnoNative
      - name: Compile the Android library's Kotlin and the Compose module
        run: ./gradlew --no-daemon :tajweedformer:compileReleaseKotlin :tajweedformer-compose:compileReleaseKotlin
      - name: The sharing sheet's layout and screenshot tests, both drawings (Views and Compose) with Android's own renderer on the JVM
        run: ./gradlew --no-daemon :tajweedformer-compose:testDebugUnitTest
      - name: The bundle dry run's steps are the publish workflow's (what the dry run shows is what the publish workflow would upload)
        run: python3 scripts/check_bundle_steps.py
      - name: Compile the README's quick start and the example app (examples/quickstart; QuickStartDocTest above keeps the README equal to it)
        run: ./gradlew --no-daemon :examples:quickstart:compileDebugKotlin

  engine:
    name: Engine through JNI, and the AAR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Engine submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-engine.sh engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tools (ninja makes the host build faster, without it scripts/build_host.sh uses make)
        run: |
          command -v ninja || timeout 120 sudo apt-get install -y ninja-build || echo "ninja-build was not installed (the package mirror did not answer), the host build uses make"
      - name: JVM tests with the engine (the host JNI library is built; the model-dependent ones skip without the model)
        run: |
          ./gradlew --no-daemon :tajweedformer-jvm:test -Pnative \
            --tests 'ai.quranlab.tajweedformer.V4ConformanceTest' --tests 'ai.quranlab.tajweedformer.TajweedApiTest' \
            --tests 'ai.quranlab.tajweedformer.TajweedModelTest' --tests 'ai.quranlab.tajweedformer.ManifestTest' \
            --tests 'ai.quranlab.tajweedformer.LayersTest' --tests 'ai.quranlab.tajweedformer.TakeLimitsTest'
      - name: AAR (arm64-v8a, armeabi-v7a, x86_64)
        run: ./gradlew --no-daemon :tajweedformer:assembleRelease
      - name: Android's verifier rule on monitors, on every class of the AAR (first the proof that the check still rejects the class 2.0.2 shipped)
        run: |
          python3 scripts/check_monitor_handlers.py --expect-rejected scripts/testdata/Telemetry-2.0.2.class
          python3 scripts/check_monitor_handlers.py tajweedformer/build/outputs/aar/*.aar
      - name: The example app (examples/quickstart)
        run: ./gradlew --no-daemon :examples:quickstart:assembleDebug
      - name: The example app as a release build shrunk with R8 and no rule of its own (the AAR's consumer rules must be enough)
        run: ./gradlew --no-daemon :examples:quickstart:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: tajweedformer/build/outputs/aar/*.aar
