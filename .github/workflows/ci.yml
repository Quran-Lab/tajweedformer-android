name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM tests (no engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: ./gradlew --no-daemon :tajweedformer-jvm:test -PnoNative
      - name: Compile the Android library's Kotlin
        run: ./gradlew --no-daemon :tajweedformer:compileReleaseKotlin

  engine:
    name: Engine through JNI, and the AAR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Engine submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-engine.sh engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tools
        run: sudo apt-get install -y ninja-build
      - name: JVM tests with the engine (V4; the model-dependent ones skip without the model)
        run: |
          ./gradlew --no-daemon :tajweedformer-jvm:test -Pnative \
            --tests 'ai.quranlab.tajweedformer.V4ConformanceTest' --tests 'ai.quranlab.tajweedformer.EngineSettingsTest' \
            --tests 'ai.quranlab.tajweedformer.TajweedApiTest' --tests 'ai.quranlab.tajweedformer.TajweedModelTest' \
            --tests 'ai.quranlab.tajweedformer.TajweedSettingsTest' --tests 'ai.quranlab.tajweedformer.ManifestTest'
      - name: AAR (arm64-v8a, armeabi-v7a)
        run: ./gradlew --no-daemon :tajweedformer:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: tajweedformer/build/outputs/aar/*.aar
